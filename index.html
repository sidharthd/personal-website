<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidharth Devaraj — Software Engineer · Product Thinker</title>
  <meta name="description" content="Personal portfolio of Sidharth Devaraj. Software Engineer and Product Thinker.">
  <meta name="color-scheme" content="light dark">

  <!-- FOUC Prevention Script -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Newsreader (Editorial Serif) & Inter (Clean UI Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-container">
    <!-- Header with accessible Theme Toggle -->
    <header class="site-header">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch between light and dark theme">
        <!-- Sun Icon (shown in dark mode to switch to light) -->
        <svg class="icon sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (shown in light mode to switch to dark) -->
        <svg class="icon moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Main Hero: Name, Tagline, & Links -->
    <main class="site-main">
      <div class="hero-content">
        <h1 class="hero-name">Sidharth Devaraj</h1>
        
        <p class="hero-tagline">
          Software Engineer <span class="separator" aria-hidden="true">·</span> Product Thinker
        </p>

        <nav class="hero-nav" aria-label="Social and professional profiles">
          <ul class="links-list">
            <li>
              <a href="https://www.linkedin.com/in/sidharthd/" target="_blank" rel="noopener noreferrer" class="profile-link">
                <span>LinkedIn</span>
                <svg class="arrow-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </a>
            </li>
            <li>
              <a href="https://github.com/sidharthd" target="_blank" rel="noopener noreferrer" class="profile-link">
                <span>GitHub</span>
                <svg class="arrow-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="site-footer">
      <p class="copyright">&copy; <span id="current-year">2026</span> Sidharth Devaraj</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
